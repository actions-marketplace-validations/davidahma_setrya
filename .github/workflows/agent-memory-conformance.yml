name: Agent memory conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-agent-fixtures:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: crewai-memory
            extra: conformance-crewai
            version: crewai=1.15.45
            surfaces: store index
          - target: cognee-dataset
            extra: conformance-cognee
            version: cognee=1.6.10
            surfaces: dataset-catalog ingested-text-files
          - target: google-adk-session
            extra: conformance-adk
            version: google-adk=2.15.1
            surfaces: session-history
          - target: openai-agents-session
            extra: agent-openai
            version: openai-agents=0.25.0
            surfaces: session-history
    env:
      COSIGN_PASSWORD: ''
      TARGET: ${{ matrix.target }}
      EXTRA: ${{ matrix.extra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Install the candidate and pinned SDK fixture
        run: python -m pip install ".[$EXTRA]" 'jsonschema>=4,<5'
      - name: Sign and replay a real local SDK run offline
        env:
          SDK_VERSION: ${{ matrix.version }}
          EXPECTED_SURFACES: ${{ matrix.surfaces }}
        run: |
          offline=(sudo -n -- /usr/bin/unshare --net /usr/bin/setpriv --reuid "$(id -u)" \
            --regid "$(id -g)" --clear-groups --no-new-privs /usr/bin/env "PATH=$PATH" COSIGN_PASSWORD=)
          cli=("$(command -v python)" -I -m setrya)
          key="$RUNNER_TEMP/fixture"
          output="$RUNNER_TEMP/agent-memory-conformance"
          "${offline[@]}" cosign generate-key-pair --output-key-prefix "$key"
          "${offline[@]}" "${cli[@]}" conformance run --target "$TARGET" --operator setrya-ci \
            --key "$key.key" --output "$output"
          "${offline[@]}" "${cli[@]}" conformance review "$output" --key "$key.pub" \
            --expect-operator setrya-ci
          "${offline[@]}" "${cli[@]}" replay "$output"
          "${offline[@]}" "$(command -v python)" -m jsonschema \
            -i "$output/erasure-receipt.json" setrya/erasure/receipt-v3.schema.json
          python - "$output/erasure-receipt.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          receipt = json.loads(Path(sys.argv[1]).read_text())
          sdk, expected = os.environ["SDK_VERSION"].split("=")
          surfaces = {row["surface"] for row in receipt["checks"] if row["status"] == "PASS"}
          if surfaces != set(os.environ["EXPECTED_SURFACES"].split()) or receipt["versions"].get(sdk) != expected:
              raise SystemExit("The signed result does not cover the expected surfaces and SDK version.")
          PY
          cp "$key.pub" "$output/ci-fixture.pub"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: agent-memory-conformance-${{ matrix.target }}
          path: ${{ runner.temp }}/agent-memory-conformance/
          if-no-files-found: error
