name: Offline qualification

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 14 * * 2'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: qualify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Qualify checkout with loopback only
        run: |
          mkdir release
          python3 -c 'import platform, sqlite3, sys; print(platform.platform(), sys.version.split()[0], sqlite3.sqlite_version)' | tee release/environment.txt
          scripts/qualify-offline.sh | tee release/checkout.txt
      - name: Qualify the unpacked release with loopback only
        run: |
          version="$(python3 -m setrya --version)"
          archive="setrya-${version}.tar.gz"
          git archive --format=tar.gz --prefix="setrya-${version}/" -o "release/$archive" HEAD
          unpack="$(mktemp -d)"
          tar -xzf "release/$archive" -C "$unpack"
          (cd "$unpack/setrya-${version}" && scripts/qualify-offline.sh) | tee release/archive.txt
          (cd release && sha256sum "$archive" > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qualified-release
          path: release/
          if-no-files-found: error

  provenance:
    name: Attest the qualified Python source archive
    needs: qualification
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: qualified-release
          path: release
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'release/setrya-*.tar.gz'
          create-storage-record: false

  assessment:
    name: Signed assessment and offline browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532
        with:
          cosign-release: v3.1.4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: scripts/browser-verifier/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
      - run: python3 scripts/verify-assessment.py --output "$RUNNER_TEMP/setrya-assessment"
      - run: python3 scripts/verify-exchange-vectors.py --output "$RUNNER_TEMP/exchange-vectors"
      - run: python3 scripts/build-browser-verifier.py --output "$RUNNER_TEMP/setrya-verify-offline.html"
      - name: Provision independent trust and pinned published exchange fixtures
        env:
          TUF_ROOT: ${{ runner.temp }}/browser-trust
        run: |
          cosign initialize
          archive="$RUNNER_TEMP/exchange-v1.9.0.zip"
          curl --fail --silent --show-error --location --max-time 60 --max-filesize 1048576 \
            https://github.com/davidahma/setrya/releases/download/v1.9.0/deletion-receipt-exchange.zip \
            --output "$archive"
          printf '%s  %s\n' a53677da6807955af310491f15236f8416abb6e0b8f5cb1dd2db4a48a64af378 "$archive" | sha256sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/exchange-v1.9.0"
      - name: Verify signed and malformed bundles without network access
        run: |
          root="$RUNNER_TEMP/browser-trust/tuf-repo-cdn.sigstore.dev/targets/trusted_root.json"
          sudo -n -- /usr/bin/unshare --net /usr/bin/setpriv --reuid "$(id -u)" \
            --regid "$(id -g)" --clear-groups --no-new-privs "$(command -v node)" \
            scripts/verify-browser-report.mjs "$RUNNER_TEMP/setrya-verify-offline.html" "$RUNNER_TEMP/setrya-assessment" \
            --vectors "$RUNNER_TEMP/exchange-vectors" --signed "$RUNNER_TEMP/exchange-v1.9.0" --root "$root"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: offline-browser-verifier
          path: ${{ runner.temp }}/setrya-verify-offline.html
          if-no-files-found: error
