name: Agent harnesses

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "12 7 * * 1"

permissions:
  contents: read

jobs:
  harnesses:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install '.[agent-openai,agent-claude,traces-langfuse,pytest,case-yaml]'
      - run: python -m pytest -q tests/test_erasure_http_case.py -k "openai or claude"
      - name: Check local agent SDK runs and self-hosted trace deletion
        run: python scripts/verify-agent-harnesses.py

  latest-sdks:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install '.[pytest,case-yaml]' langgraph-checkpoint-sqlite
      - name: Install the latest published releases independently of Setrya's constraints
        run: |
          python -m pip install --upgrade openai-agents claude-agent-sdk langfuse langgraph
          python scripts/check-latest-agent-sdks.py --record "$RUNNER_TEMP/selected-sdk-versions.json"
          python -m pip check
      - name: Run native sessions, hooks and self-hosted trace tests
        run: python scripts/verify-agent-harnesses.py
      - run: python -m pytest -q tests/test_erasure_http_case.py -k "openai or claude"
      - name: Run real LangGraph checkpoints, memory and replay
        run: |
          python -c 'from langgraph.graph import StateGraph; from langgraph.checkpoint.sqlite import SqliteSaver'
          python -m pytest -q tests/test_shared_investigation.py tests/test_erasure_trial.py

      - name: Propose any upper-bound changes after all native checks pass
        run: |
          python scripts/check-latest-agent-sdks.py --qualified "$RUNNER_TEMP/selected-sdk-versions.json"             --output "$RUNNER_TEMP/qualified-sdk-caps.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualified-sdk-caps
          path: ${{ runner.temp }}/qualified-sdk-caps.json
          if-no-files-found: error

  report-regression:
    needs: latest-sdks
    if: ${{ failure() && needs.latest-sdks.result == 'failure' && github.ref_name == github.event.repository.default_branch && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    concurrency:
      group: latest-sdk-regression-issue
      cancel-in-progress: false
    steps:
      - name: Open one compatibility issue for the failed check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Latest SDK compatibility failed"
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq '.[] | select(.title == "Latest SDK compatibility failed" and .user.login == "github-actions[bot]" and (.pull_request | not)) | .number')
          if [[ -z "$existing" ]]; then
            body="$RUNNER_TEMP/compatibility-issue.md"
            echo "The weekly compatibility check failed. The run records the resolved dependency versions and the failing native test." > "$body"
            echo >> "$body"
            echo "[Inspect the run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)." >> "$body"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
          fi
